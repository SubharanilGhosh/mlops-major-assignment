apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mlops-app
  template:
    metadata:
      labels:
        app: mlops-app
    spec:
      containers:
      - name: mlops-app-container
        image: subharanil30/mlops-assignment:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-app-service
spec:
  selector:
    app: mlops-app
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000