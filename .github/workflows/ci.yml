# Name of your workflow
name: Model CI-CD

# Triggers: Run this workflow on every 'push' to any branch
on: [push]

# Jobs: A list of tasks to run
jobs:
  # Job ID: we call this one 'check_working_repo' [cite: 38]
  check_working_repo:
    # OS: Run this on the latest Ubuntu (Linux) machine
    runs-on: ubuntu-latest

    # Steps: The sequence of commands to run
    steps:
    # 1. Check out your code [cite: 39]
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Set up a Python environment [cite: 40]
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Use Python 3.10

    # 3. Install Python dependencies [cite: 40]
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run the training script [cite: 41]
    - name: Run training script
      run: python train.py

    # 5. Run the testing script [cite: 42]
    - name: Run testing script
      run: python test.py